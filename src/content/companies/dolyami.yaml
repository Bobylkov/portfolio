paragraphs:
  - "Покупатель платит по 25% от суммы покупки раз в две недели — такие сервисы называют BNPL. А ещё Долями — экосистема для шопинга с ИИ, которая помогает находить лучшие товары и магазины."
  - "Проектировал платёжную форму, сайт, личный кабинет, мобильное приложение и дизайн-систему — в команде с лидом и вторым дизайнером."

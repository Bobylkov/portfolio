paragraphs:
  - "В СберЗдоровье записываются к врачу, сдают анализы и получают онлайн-консультации. Я отвечал за ключевой путь пациента — от поиска врача на карте и по отзывам до записи, за оплату кросс-продуктов, обследований и консультаций."
  - "Работал в связке с продуктом, исследователями и разработкой: проверял решения на людях, следил за метриками после запуска и переносил удачные паттерны в дизайн-систему."
